name: Generate Hebrew recordings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hebrew-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts
      - name: Generate Israeli Hebrew MP3s
        run: |
          python - <<'PY'
          import asyncio, pathlib, re, edge_tts
          root = pathlib.Path('audio')
          root.mkdir(exist_ok=True)
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          raw = re.search(r'const raw=`(.*?)`\.trim\(\);', html, re.S).group(1).strip()
          rows = raw.splitlines()
          assert len(rows) == 135, len(rows)
          async def main():
              for i, row in enumerate(rows, 1):
                  sentence = row.split('|')[2]
                  target = root / f'{i}.mp3'
                  if target.exists() and target.stat().st_size > 1000:
                      continue
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(sentence, 'he-IL-AvriNeural').save(str(target))
                          assert target.stat().st_size > 1000
                          break
                      except Exception:
                          target.unlink(missing_ok=True)
                          if attempt == 2:
                              raise
                          await asyncio.sleep(3 * (attempt + 1))
          asyncio.run(main())
          PY
      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Add Israeli Hebrew pronunciation recordings"
            git push
          fi
